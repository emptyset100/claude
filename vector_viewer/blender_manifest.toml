schema_version = "1.0.0"

id = "vector_viewer"
version = "1.1.0"
name = "Vector Viewer"
tagline = "Visualisation animée de vecteurs cinématiques (r, v, a)"
maintainer = "Empty"
type = "add-on"

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

tags = ["3D View", "Animation", "Geometry Nodes"]

# SymPy (et sa dépendance mpmath) sont fournis sous forme de wheels pur
# Python : plus besoin de les installer à la main dans le Python de
# Blender. Testé jusqu'à Blender 5.2.2 LTS, dont la nouvelle API des
# entrées de modifier (``mod.properties.inputs``) est gérée par
# modifier_inputs.py.
wheels = [
    "./wheels/mpmath-1.3.0-py3-none-any.whl",
    "./wheels/sympy-1.14.0-py3-none-any.whl",
]

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "/.git/",
    "/*.zip",
    ".DS_Store",
    "*.pyc",
]
